  function drawLine(values, color, width) {
    ctx.beginPath();
    for (let j = 0; j < xs.length; j++) {

    ctx.lineWidth = width;
    ctx.lineJoin = 'round';

    ctx.clearRect(0, 0, W, H);
    ctx.font = '13px system-ui, sans-serif';
