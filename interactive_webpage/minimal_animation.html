      if(j===0) ctx.moveTo(X(xs[j]),Y(y)); else ctx.lineTo(X(xs[j]),Y(y));
    });
    ctx.stroke(); ctx.restore();
  }
  slider.addEventListener('input', draw);
  draw();
</script>
</body>
</html>
